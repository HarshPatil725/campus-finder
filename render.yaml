# =========================================================================
# Render Blueprint Infrastructure as Code
# Deploys Docker Web Service + Managed Private PostgreSQL Database
# =========================================================================
services:
  - type: web
    name: campus-wifi-tracker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: REQUIRE_AUTH
        value: "false"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: campus-wifi-db
          property: connectionString

databases:
  - name: campus-wifi-db
    databaseName: campus_wifi_db
    user: campus_admin
    plan: free
    region: oregon
    # Empty ipAllowList ensures PostgreSQL is strictly accessible via private internal network
    ipAllowList: []
